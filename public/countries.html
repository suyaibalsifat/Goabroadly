<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sovereign Pathways | GoAbroadly</title>
  <link rel="stylesheet" href="css/explore.css">
  <link rel="stylesheet" href="css/countries.css">
</head>

<body>

  <!-- JURISDICTION EXPLORATION HEADER PORT -->
  <!-- ==========================================
     HERO EXPLORATION DECK WITH AMBIENT CANVAS
     ========================================== -->
  <!-- ==========================================
     VIBRANT LIGHT AMBIENT HERO CANVAS
     ========================================== -->
  <!-- ==========================================
     EPIC TRAVELLER LIGHT HERO CANVAS
     ========================================== -->
  <header class="jurisdiction-hero">
    <div class="jurisdiction-hero__bg"></div>
    <div class="hero-overlay-mesh"></div>

    <div class="hero-content-stack">
      <span class="hero-pill-badge">🌍 Sovereign Gateway Control</span>
      <h1 class="hero-main-title">Global Mobility Frameworks</h1>
      <p class="hero-subtitle">Cross-examine immigration entry points, academic structures, and premium cultural
        itineraries across premier jurisdictions.</p>

      <div class="search-filter-hub">
        <input type="text" id="country-search" placeholder="Filter pathways by destination name...">
        <select id="region-filter">
          <option value="all">All Continents</option>
          <option value="Asia">Asia Sector</option>
          <option value="Europe">Europe Sector</option>
          <option value="Americas">Americas Sector</option>
          <option value="Oceania">Oceania Sector</option>
        </select>
      </div>
    </div>
  </header>
  <!-- RENDER CATALOG GRIDS -->
  <main class="catalog-grid-wrapper">
    <div class="grid-stats-bar">
      <span id="jurisdiction-count">Syncing global mobility tracks...</span>
    </div>

    <section class="jurisdiction-cards-grid" id="countries-grid-container">
      <!-- Injected Dynamically by System Engines -->
    </section>
  </main>

  <script src="js/countries.js"></script>

</html>
